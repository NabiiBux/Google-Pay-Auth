# ==============================================================================
# Unified Nginx Virtual Hosts for Namecheap AlmaLinux VPS
# Place in: /etc/nginx/conf.d/gnbmentor-ecosystem.conf
# ==============================================================================

# 1. Payment Gateway: pay.gnbmentor.com
server {
    listen 80;
    listen [::]:80;
    server_name pay.gnbmentor.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/pay.gnbmentor.com_access.log;
    error_log /var/log/nginx/pay.gnbmentor.com_error.log;
}

# 2. Workspace & Reseller Portal: portal.gnbmentor.com
server {
    listen 80;
    listen [::]:80;
    server_name portal.gnbmentor.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Proxies to local node server (port 3000 or 3001)
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/portal.gnbmentor.com_access.log;
    error_log /var/log/nginx/portal.gnbmentor.com_error.log;
}

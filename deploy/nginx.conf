# Nginx configuration for pay.gnbmentor.com
# Location on AlmaLinux: /etc/nginx/conf.d/pay.gnbmentor.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name pay.gnbmentor.com;

    # Let's Encrypt Certbot ACME challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy to Node.js backend & frontend on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real IP headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Performance & timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/pay.gnbmentor.com_access.log;
    error_log /var/log/nginx/pay.gnbmentor.com_error.log;
}

# NOTE: Running 'certbot --nginx -d pay.gnbmentor.com' will automatically
# generate your SSL certificates and add the HTTPS server block below.
